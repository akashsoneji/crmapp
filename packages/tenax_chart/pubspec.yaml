name: tenax_chart
description: Reusable Flutter wrapper for the Tenax Chart WebView bundle (push mode). App-agnostic; host apps supply data through TenaxChartDataSource.
version: 0.2.1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.0.0

flutter:
  assets:
    - assets/chart/
