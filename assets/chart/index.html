<!DOCTYPE html>
<html>
<head>
<style>
		#chartContainer div:first-child {
			width: 100% !important;
			height: 100% !important;
		}

		#chartContainer {
			height: 96vh;
			width: 100% !important;
            /* padding: 10px !important; */

		}
	</style>
    <title>TradingView Chart</title>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        let selectedSymbol = "EURUSD";
        let chartWidget = null;

        function updateSymbol(newSymbol) {
            selectedSymbol = newSymbol;
            console.log("Updated symbol:", selectedSymbol);
            createTradingViewChart(selectedSymbol);
        }

        function createTradingViewChart(symbol) {
            const chartContainer = document.getElementById('chartContainer');
            if (!chartContainer) {
                console.error("Chart container not found");
                return;
            }
            
            // Clear previous chart
            chartContainer.innerHTML = '';
            
            // Destroy existing widget if it exists
            if (chartWidget) {
                try {
                    chartWidget.remove();
                } catch (e) {
                    console.log("Error removing previous chart:", e);
                }
                chartWidget = null;
            }

            // Wait for TradingView to be available
            if (typeof TradingView === 'undefined') {
                console.log("TradingView not loaded yet, waiting...");
                setTimeout(function() {
                    createTradingViewChart(symbol);
                }, 100);
                return;
            }

            try {
                chartWidget = new TradingView.widget({
                    container_id: 'chartContainer',
                    symbol: symbol,
                    interval: '3',
                    timezone: 'Etc/UTC',
                    theme: 'light',
                    style: '1',
                    locale: 'en',
                    toolbar_bg: '#f1f3f6',
                    enable_publishing: false,
                    allow_symbol_change: false,
                    details: false,
                    autosize: true,
                    hide_volume: true,  // Disable volume display
                });
                console.log("TradingView chart created for symbol:", symbol);
            } catch (e) {
                console.error("Error creating TradingView chart:", e);
            }
        }
        
        // Initialize chart when page loads
        window.addEventListener('load', function() {
            console.log('Page loaded, initializing chart for:', selectedSymbol);
            // Wait a bit for TradingView script to load
            setTimeout(function() {
                createTradingViewChart(selectedSymbol);
            }, 200);
        });
    </script>
</head>
<body>
    <div id="chartContainer"></div>
</body>
</html>
